<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">DELTA OMEGA Rev5 keycap fit envelope</title>
  <desc id="desc">Side profile showing a rounded lower keycap skirt and upper envelope, with the case rim at 8.8 millimeters and the keycap envelope top at 9 millimeters.</desc>
  <rect width="1000" height="520" fill="#f4f1e9"/>
  <g stroke="#20211f" stroke-width="3" fill="none">
    <path d="M170 430H850"/>
    <path d="M190 430V209H810V430"/>
  </g>
  <g fill="#d9d4c7" stroke="#20211f" stroke-width="3">
    <path d="M120 430V209H190V430Z"/>
    <path d="M810 209H880V430H810Z"/>
    <rect x="445" y="390" width="110" height="40"/>
  </g>
  <g fill="#fffaf0" stroke="#c35a35" stroke-width="4">
    <rect x="390" y="150" width="220" height="80" rx="40"/>
    <rect x="410" y="230" width="180" height="80" rx="30" fill="#f6e1d5"/>
  </g>
  <g stroke="#b24729" stroke-width="2">
    <path d="M500 150V310" stroke-dasharray="8 7"/>
  </g>
  <g fill="#20211f" font-family="Arial, sans-serif" font-size="22">
    <text x="70" y="229">case rim</text>
    <text x="745" y="229">case rim</text>
    <text x="438" y="378">KS-33</text>
    <text x="305" y="138">upper: 16.6 x 15.6, r7.0</text>
    <text x="286" y="336">lower: 14.0 x 14.0, r3.5</text>
    <text x="170" y="470">PCB top z = 1.6</text>
    <text x="170" y="500">case rim z = 8.8</text>
    <text x="630" y="470">envelope top z = 9.0</text>
  </g>
  <g stroke="#20211f" stroke-width="2">
    <path d="M190 442V458"/>
    <path d="M810 442V458"/>
    <path d="M170 450H830"/>
    <path d="M170 444V456"/>
    <path d="M830 444V456"/>
  </g>
  <text x="438" y="490" fill="#20211f" font-family="Arial, sans-serif" font-size="20">z dimensions in mm</text>
</svg>
